<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalk &amp; Turf Log</title>
<meta name="description" content="Personal training log for climbing, football, racket sports, gym and yoga.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chalk &amp; Turf">
<link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Chalk &amp; Turf</h1>
      <button type="button" class="ghost" id="data-btn" aria-label="Data, backup and import">Data</button>
      <button type="button" class="primary log-btn" id="log-btn">+ Log</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sports"></nav>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<div class="overlay" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" id="sheet-close">Close</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/form.js"></script>
<script src="js/views.js"></script>
<script src="js/media.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
